# api.doppiai.uz -> RAGFlow Wrapper API (ragflow-backend.service, 127.0.0.1:8110)
# O'rnatish:
#   sudo cp api.doppiai.uz.nginx.conf /etc/nginx/sites-available/api.doppiai.uz
#   sudo ln -s /etc/nginx/sites-available/api.doppiai.uz /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d api.doppiai.uz --redirect   # HTTPS + 80->443 redirect
server {
    listen 80;
    listen [::]:80;
    server_name api.doppiai.uz;

    # hujjat yuklash (upload) uchun
    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:8110;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        # /chat LLM javobini kutadi — uzunroq timeout
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
