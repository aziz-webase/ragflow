# ============================================================
# RAGFlow deployment sozlamalari
# Bu faylni deploy.sh o'qiydi va ragflow/docker/.env ga qo'llaydi.
# Faqat shu faylni tahrirlang; parollar deploy.sh tomonidan
# avtomatik (random) generatsiya qilinadi.
# ============================================================

# RAGFlow versiyasi (rasmiy release tegi)
RAGFLOW_VERSION=v0.26.4

# Vaqt mintaqasi
TZ=Asia/Tashkent

# Hujjat dvigateli: elasticsearch (default) | infinity | opensearch
DOC_ENGINE=elasticsearch

# RAGFlow serveri qurilmasi (embedding + deepdoc shu yerda ishlaydi): cpu | gpu
# gpu tanlansa serverda NVIDIA drayver + NVIDIA Container Toolkit bo'lishi shart.
DEVICE=cpu

# Local embedding modeli (TEI orqali serveringizda ishlaydi):
#   BAAI/bge-m3                -> ko'p tilli, o'zbek/rus uchun mos (TAVSIYA)
#   Qwen/Qwen3-Embedding-0.6B  -> yengil, default
#   BAAI/bge-small-en-v1.5     -> faqat ingliz, kichik
TEI_MODEL=BAAI/bge-m3

# Local embedding servisini (tei-cpu profili) yoqish
# Embedding/LLM/rerank tashqi API'dan (gpu.uz) ishlatiladi -> local TEI kerak emas
ENABLE_LOCAL_EMBEDDING=false

# Elasticsearch xotira limiti (baytlarda). Server RAM >= 16GB tavsiya etiladi.
# Server RAM 7GB va boshqa servislar ham ishlaydi -> ES uchun 2 GiB (heap 1 GiB)
MEM_LIMIT=2147483648
ES_JAVA_OPTS="-Xms1g -Xmx1g"

# ------------------------------------------------------------
# Host portlari. Barchasi faqat 127.0.0.1 ga bog'lanadi (tashqariga ochilmaydi).
# 80/443 (nginx), 6379 (redis), 9000/9001 (minio) bu serverda band.
# ------------------------------------------------------------
BIND_IP=127.0.0.1
SVR_HTTP_PORT=9380        # RAGFlow HTTP API (backend shu portga ulanadi)
SVR_WEB_HTTP_PORT=8081    # RAGFlow Web UI
SVR_WEB_HTTPS_PORT=8443
ADMIN_SVR_HTTP_PORT=9381
SVR_MCP_PORT=9382
GO_HTTP_PORT=9384
GO_ADMIN_PORT=9383
ES_PORT=1200
EXPOSE_MYSQL_PORT=13306
MINIO_PORT=19000
MINIO_CONSOLE_PORT=19001
REDIS_PORT=16379
